version: '3.8'

services:
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    depends_on:
      - nginx
    networks:
      - microservices-network
    environment:
      - REACT_APP_API_URL=http://localhost

  nginx:
    build: ./nginx
    container_name: api-gateway
    ports:
      - "80:80"
    depends_on:
      - user-service
      - product-service
      - order-service
    networks:
      - microservices-network

  user-service:
    build: ./user-service
    container_name: user-service
    environment:
      DATABASE_URL: mysql+pymysql://user:password@user-db:3306/user_db
      SERVICE_PORT: 8001
    ports:
      - "8001:8001"
    depends_on:
      user-db:
        condition: service_healthy
    networks:
      - microservices-network

  user-db:
    image: mysql:8.0
    container_name: user-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: user_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - user_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10
      interval: 5s
    networks:
      - microservices-network

  product-service:
    build: ./product-service
    container_name: product-service
    environment:
      DATABASE_URL: mysql+pymysql://user:password@product-db:3306/product_db
      SERVICE_PORT: 8002
    ports:
      - "8002:8002"
    depends_on:
      product-db:
        condition: service_healthy
    networks:
      - microservices-network

  product-db:
    image: mysql:8.0
    container_name: product-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: product_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306"
    volumes:
      - product_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10
      interval: 5s
    networks:
      - microservices-network

  order-service:
    build: ./order-service
    container_name: order-service
    environment:
      DATABASE_URL: mysql+pymysql://user:password@order-db:3306/order_db
      SERVICE_PORT: 8003
      USER_SERVICE_URL: http://user-service:8001
      PRODUCT_SERVICE_URL: http://product-service:8002
    ports:
      - "8003:8003"
    depends_on:
      order-db:
        condition: service_healthy
    networks:
      - microservices-network

  order-db:
    image: mysql:8.0
    container_name: order-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: order_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3308:3306"
    volumes:
      - order_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10
      interval: 5s
    networks:
      - microservices-network

volumes:
  user_db_data:
  product_db_data:
  order_db_data:

networks:
  microservices-network:
    driver: bridge
