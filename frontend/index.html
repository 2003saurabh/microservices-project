<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microservices Store</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); margin-bottom: 30px; text-align: center; }
        header h1 { color: #333; margin-bottom: 10px; }
        header p { color: #666; font-size: 14px; }
        .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
        .card h2 { color: #333; margin-bottom: 20px; border-bottom: 2px solid #667eea; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #333; font-weight: 500; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; }
        button { background: #667eea; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; transition: background 0.3s; }
        button:hover { background: #764ba2; }
        .button-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .data-section { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
        .data-card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
        .data-card h3 { color: #333; margin-bottom: 15px; border-bottom: 2px solid #667eea; padding-bottom: 10px; }
        .item { background: #f5f5f5; padding: 15px; margin-bottom: 10px; border-radius: 5px; border-left: 4px solid #667eea; }
        .item p { color: #666; font-size: 14px; margin-bottom: 5px; }
        .item strong { color: #333; }
        .error { background: #fee; color: #c33; padding: 15px; border-radius: 5px; margin-bottom: 15px; border-left: 4px solid #c33; }
        .success { background: #efe; color: #3c3; padding: 15px; border-radius: 5px; margin-bottom: 15px; border-left: 4px solid #3c3; }
        .loading { text-align: center; color: #999; font-style: italic; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🛒 Microservices Store</h1>
            <p>3-Tier Architecture: User • Product • Order Management</p>
        </header>

        <div class="main-grid">
            <div class="card">
                <h2>👤 Users</h2>
                <div id="userError" class="error" style="display:none;"></div>
                <div id="userSuccess" class="success" style="display:none;"></div>
                <div class="form-group">
                    <label>Name:</label>
                    <input type="text" id="userName" placeholder="Enter user name">
                </div>
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" id="userEmail" placeholder="Enter email">
                </div>
                <div class="form-group">
                    <label>Phone:</label>
                    <input type="tel" id="userPhone" placeholder="Enter phone (optional)">
                </div>
                <div class="button-group">
                    <button onclick="createUser()">Create User</button>
                    <button onclick="loadUsers()">Refresh</button>
                </div>
            </div>

            <div class="card">
                <h2>📦 Products</h2>
                <div id="productError" class="error" style="display:none;"></div>
                <div id="productSuccess" class="success" style="display:none;"></div>
                <div class="form-group">
                    <label>Name:</label>
                    <input type="text" id="productName" placeholder="Enter product name">
                </div>
                <div class="form-group">
                    <label>Description:</label>
                    <textarea id="productDesc" placeholder="Enter description" rows="2"></textarea>
                </div>
                <div class="form-group">
                    <label>Price:</label>
                    <input type="number" id="productPrice" placeholder="Enter price" step="0.01">
                </div>
                <div class="form-group">
                    <label>Stock:</label>
                    <input type="number" id="productStock" placeholder="Enter stock quantity">
                </div>
                <div class="button-group">
                    <button onclick="createProduct()">Create Product</button>
                    <button onclick="loadProducts()">Refresh</button>
                </div>
            </div>

            <div class="data-section">
                <div class="data-card">
                    <h3>Users List</h3>
                    <div id="usersList" class="loading">Loading...</div>
                </div>
                <div class="data-card">
                    <h3>Products List</h3>
                    <div id="productsList" class="loading">Loading...</div>
                </div>
                <div class="data-card">
                    <h3>Orders List</h3>
                    <div id="ordersList" class="loading">Loading...</div>
                </div>
            </div>

            <div class="card" style="grid-column: 1 / -1;">
                <h2>🛍️ Create Order</h2>
                <div id="orderError" class="error" style="display:none;"></div>
                <div id="orderSuccess" class="success" style="display:none;"></div>
                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px;">
                    <div class="form-group">
                        <label>User ID:</label>
                        <input type="number" id="orderUserId" placeholder="Enter user ID">
                    </div>
                    <div class="form-group">
                        <label>Product ID:</label>
                        <input type="number" id="orderProductId" placeholder="Enter product ID">
                    </div>
                    <div class="form-group">
                        <label>Quantity:</label>
                        <input type="number" id="orderQuantity" placeholder="Enter quantity">
                    </div>
                </div>
                <button onclick="createOrder()">Create Order</button>
            </div>
        </div>
    </div>

    <script>
        // ✅ Your public IP is configured here
        // 🌍 Automatically detect environment (local, EC2, or domain)
        const hostname = window.location.hostname;
        let API_BASE = '';

        if (hostname === 'localhost' || hostname === '127.0.0.1') {
            API_BASE = 'http://localhost';
        } else {
            API_BASE = `${window.location.protocol}//${window.location.hostname}`;
        }

        console.log('🔍 Detected API Base:', API_BASE);

        window.onload = function() { loadUsers(); loadProducts(); loadOrders(); };

        async function createUser() {
            const name = document.getElementById('userName').value;
            const email = document.getElementById('userEmail').value;
            const phone = document.getElementById('userPhone').value;
            if (!name || !email) { showError('userError', 'Please fill in name and email'); return; }
            try {
                const response = await fetch(`${API_BASE}/api/v1/users/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, phone: phone || null })
                });
                const data = await response.json();
                if (response.ok) {
                    showSuccess('userSuccess', `User "${name}" created successfully!`);
                    document.getElementById('userName').value = '';
                    document.getElementById('userEmail').value = '';
                    document.getElementById('userPhone').value = '';
                    loadUsers();
                } else {
                    showError('userError', data.detail || 'Error creating user');
                }
            } catch (error) {
                showError('userError', 'Connection error: ' + error.message);
            }
        }

        async function loadUsers() {
            try {
                const response = await fetch(`${API_BASE}/api/v1/users/`);
                const users = await response.json();
                const usersList = document.getElementById('usersList');
                if (users.length === 0) {
                    usersList.innerHTML = '<p class="loading">No users yet</p>';
                } else {
                    usersList.innerHTML = users.map(user => `<div class="item"><p><strong>ID:</strong> ${user.id}</p><p><strong>Name:</strong> ${user.name}</p><p><strong>Email:</strong> ${user.email}</p></div>`).join('');
                }
            } catch (error) {
                document.getElementById('usersList').innerHTML = `<p class="error">Error loading users</p>`;
            }
        }

        async function createProduct() {
            const name = document.getElementById('productName').value;
            const description = document.getElementById('productDesc').value;
            const price = parseFloat(document.getElementById('productPrice').value);
            const stock = parseInt(document.getElementById('productStock').value);
            if (!name || !price || !stock) { showError('productError', 'Please fill in all fields'); return; }
            try {
                const response = await fetch(`${API_BASE}/api/v1/products/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, description, price, stock })
                });
                const data = await response.json();
                if (response.ok) {
                    showSuccess('productSuccess', `Product "${name}" created successfully!`);
                    document.getElementById('productName').value = '';
                    document.getElementById('productDesc').value = '';
                    document.getElementById('productPrice').value = '';
                    document.getElementById('productStock').value = '';
                    loadProducts();
                } else {
                    showError('productError', data.detail || 'Error creating product');
                }
            } catch (error) {
                showError('productError', 'Connection error: ' + error.message);
            }
        }

        async function loadProducts() {
            try {
                const response = await fetch(`${API_BASE}/api/v1/products/`);
                const products = await response.json();
                const productsList = document.getElementById('productsList');
                if (products.length === 0) {
                    productsList.innerHTML = '<p class="loading">No products yet</p>';
                } else {
                    productsList.innerHTML = products.map(product => `<div class="item"><p><strong>ID:</strong> ${product.id}</p><p><strong>Name:</strong> ${product.name}</p><p><strong>Price:</strong> $${product.price}</p><p><strong>Stock:</strong> ${product.stock}</p></div>`).join('');
                }
            } catch (error) {
                document.getElementById('productsList').innerHTML = `<p class="error">Error loading products</p>`;
            }
        }

        async function createOrder() {
            const userId = parseInt(document.getElementById('orderUserId').value);
            const productId = parseInt(document.getElementById('orderProductId').value);
            const quantity = parseInt(document.getElementById('orderQuantity').value);
            if (!userId || !productId || !quantity) { showError('orderError', 'Please fill in all fields'); return; }
            try {
                const response = await fetch(`${API_BASE}/api/v1/orders/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, product_id: productId, quantity })
                });
                const data = await response.json();
                if (response.ok) {
                    showSuccess('orderSuccess', `Order created! Total: $${data.total_price}`);
                    document.getElementById('orderUserId').value = '';
                    document.getElementById('orderProductId').value = '';
                    document.getElementById('orderQuantity').value = '';
                    loadOrders();
                } else {
                    showError('orderError', data.detail || 'Error creating order');
                }
            } catch (error) {
                showError('orderError', 'Connection error: ' + error.message);
            }
        }

        async function loadOrders() {
            try {
                const response = await fetch(`${API_BASE}/api/v1/orders/`);
                const orders = await response.json();
                const ordersList = document.getElementById('ordersList');
                if (orders.length === 0) {
                    ordersList.innerHTML = '<p class="loading">No orders yet</p>';
                } else {
                    ordersList.innerHTML = orders.map(order => `<div class="item"><p><strong>ID:</strong> ${order.id}</p><p><strong>Total:</strong> $${order.total_price}</p><p><strong>Status:</strong> ${order.status}</p></div>`).join('');
                }
            } catch (error) {
                document.getElementById('ordersList').innerHTML = `<p class="error">Error loading orders</p>`;
            }
        }

        function showError(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.style.display = 'block';
            setTimeout(() => element.style.display = 'none', 5000);
        }

        function showSuccess(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.style.display = 'block';
            setTimeout(() => element.style.display = 'none', 5000);
        }
    </script>
</body>
</html>
